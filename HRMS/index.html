<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/styles/Login.css">
</head>

<body class="bg-light bg-opacity-75">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row shadow-lg rounded-4 overflow-hidden w-100" style="max-width: 900px; height: 500px;">
            <div class="col-md-6 d-none d-md-block p-0 bg-primary bg-opacity-10">
                <div class="h-100" style="background: url('./assets/images/loginBW.jpeg') center/cover;"></div>
            </div>
            
            <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">HRMS Portal</h2>
                    <p class="text-muted">Sign in to your account</p>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="empId" class="form-label">Employee ID</label>
                        <input type="text" class="form-control form-control-lg" id="empId" placeholder="Enter your employee ID" autocomplete="off">
                        <div id="empIdError" class="invalid-feedback"></div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password">
                        <div id="passwordError" class="invalid-feedback"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Login
                    </button>
                    
                    <div class="text-center">
                        <a href="#" class="text-decoration-none">Forgot password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Role Selection Modal -->
    <div class="modal fade" id="roleSelectionModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Select Dashboard</h5>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="mb-4 fs-5">
                        You have admin privileges. Which dashboard would you like to access?
                    </p>

                    <div class="d-grid gap-3 px-5">
                        <button id="adminDashboardBtn" class="btn btn-primary btn-lg py-3">
                            <i class="bi bi-speedometer2 me-2"></i> Admin Dashboard
                        </button>
                        <button id="userDashboardBtn" class="btn btn-outline-primary btn-lg py-3">
                            <i class="bi bi-person me-2"></i> User Dashboard
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/scripts/Login.js"></script>
</body>
</html>
